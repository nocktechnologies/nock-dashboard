<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account Locked — NockCC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0f9ff', 500: '#0ea5e9', 900: '#0c4a6e' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans antialiased flex items-center justify-center">
    <div class="w-full max-w-sm px-6 text-center">
        <div class="bg-gray-900 border border-gray-800 rounded-lg p-8">
            <svg class="w-12 h-12 text-red-500 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
            </svg>
            <h1 class="text-xl font-bold text-white mb-2">Account Locked</h1>
            <p class="text-sm text-gray-400 mb-6">
                Too many failed login attempts. Your account has been temporarily locked for 15 minutes.
            </p>
            <a href="/accounts/login/"
               class="inline-block bg-gray-800 hover:bg-gray-700 text-white font-medium py-2 px-4 rounded-md text-sm transition">
                Try Again Later
            </a>
        </div>
    </div>
</body>
</html>
