{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Nock Dashboard{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/nockcc.css">
    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #070710;
            position: relative;
            overflow: hidden;
        }

        .login-circuits {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .login-circuits svg {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0.12;
        }

        .login-page::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(16, 185, 129, 0.08) 0%, rgba(16, 185, 129, 0.03) 40%, transparent 70%);
            pointer-events: none;
        }

        .login-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 0 var(--space-4);
        }

        .login-card {
            width: 100%;
            padding: 40px 32px 32px;
            background: rgba(17, 17, 25, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(16, 185, 129, 0.15);
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4), 0 0 80px rgba(16, 185, 129, 0.06);
            position: relative;
        }

        .login-card::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 13px;
            background: conic-gradient(from var(--angle, 0deg), transparent 30%, #10B981 45%, #34D399 55%, #10B981 65%, transparent 80%);
            z-index: -1;
            animation: login-border-spin 6s linear infinite;
            opacity: 0.35;
        }

        @keyframes login-border-spin { to { --angle: 360deg; } }
        @property --angle { syntax: '<angle>'; initial-value: 0deg; inherits: false; }

        .login-logo {
            width: 72px;
            height: 72px;
            margin: 0 auto 20px;
            position: relative;
        }

        .login-logo-circle {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: linear-gradient(160deg, #0d0d1a 0%, #13132a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.15), inset 0 0 20px rgba(16, 185, 129, 0.05);
        }

        .login-logo-circle::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            background: linear-gradient(135deg, #10B981, #34D399, #10B981);
            z-index: -1;
            opacity: 0.8;
        }

        .login-logo-circle::after {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 50%;
            background: linear-gradient(160deg, #0d0d1a, #13132a);
            z-index: -1;
        }

        .login-brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .login-brand-name {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 2px;
        }

        .login-brand-sub {
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .auth-heading {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: 24px;
        }

        .login-field {
            margin-bottom: var(--space-4);
        }

        .login-field label {
            display: block;
            font-size: var(--text-sm);
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .login-field .ncc-input {
            background: rgba(10, 10, 15, 0.6);
            border-color: rgba(30, 30, 46, 0.8);
            padding: 10px 14px;
            font-size: var(--text-sm);
        }

        .login-field .ncc-input:focus {
            border-color: rgba(16, 185, 129, 0.5);
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.1);
        }

        .field-errors {
            margin-top: 4px;
            font-size: 0.75rem;
            color: #f87171;
        }

        .login-submit {
            width: 100%;
            padding: 12px var(--space-4);
            background: #10B981;
            color: white;
            font-weight: 600;
            font-size: var(--text-sm);
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 200ms ease;
            margin-top: var(--space-2);
            letter-spacing: 0.02em;
        }

        @media (hover: hover) {
            .login-submit:hover {
                background: #059669;
                box-shadow: 0 4px 16px rgba(16, 185, 129, 0.3);
            }
        }

        .auth-links {
            text-align: center;
            margin-top: 20px;
            font-size: 0.8125rem;
            color: var(--text-muted);
        }

        .auth-links a {
            color: #10B981;
            text-decoration: none;
        }

        .auth-links a:hover { text-decoration: underline; }

        .auth-message {
            text-align: center;
            color: var(--text-secondary);
            font-size: var(--text-sm);
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .login-footer {
            text-align: center;
            font-size: 0.6875rem;
            color: var(--text-muted);
            margin-top: 32px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        @keyframes circuit-pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }

        .circuit-node { animation: circuit-pulse 3s ease-in-out infinite; }
        .circuit-node:nth-child(2) { animation-delay: 0.5s; }
        .circuit-node:nth-child(3) { animation-delay: 1s; }
        .circuit-node:nth-child(4) { animation-delay: 1.5s; }
        .circuit-node:nth-child(5) { animation-delay: 2s; }
        .circuit-node:nth-child(6) { animation-delay: 0.8s; }
    </style>
</head>
<body>
    <div class="login-page">
        <div class="login-circuits">
            <svg viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
                <path d="M0 200 H300 Q320 200 320 220 V300 Q320 320 340 320 H600" stroke="url(#circuit-grad)" stroke-width="1"/>
                <path d="M0 400 H200 Q220 400 220 380 V320 Q220 300 240 300 H500 Q520 300 520 280 V200 Q520 180 540 180 H800" stroke="url(#circuit-grad)" stroke-width="1"/>
                <path d="M0 600 H400 Q420 600 420 580 V500 Q420 480 440 480 H700" stroke="url(#circuit-grad2)" stroke-width="1"/>
                <path d="M1200 150 H900 Q880 150 880 170 V250 Q880 270 860 270 H600" stroke="url(#circuit-grad2)" stroke-width="1"/>
                <path d="M1200 350 H1000 Q980 350 980 370 V450 Q980 470 960 470 H700 Q680 470 680 490 V550 Q680 570 660 570 H400" stroke="url(#circuit-grad)" stroke-width="1"/>
                <path d="M1200 550 H950 Q930 550 930 530 V480 Q930 460 910 460 H750" stroke="url(#circuit-grad2)" stroke-width="1"/>
                <circle class="circuit-node" cx="300" cy="200" r="3" fill="#10B981"/>
                <circle class="circuit-node" cx="600" cy="320" r="3" fill="#34D399"/>
                <circle class="circuit-node" cx="500" cy="300" r="2.5" fill="#10B981"/>
                <circle class="circuit-node" cx="800" cy="180" r="3" fill="#34D399"/>
                <circle class="circuit-node" cx="700" cy="480" r="3" fill="#10B981"/>
                <circle class="circuit-node" cx="400" cy="600" r="2.5" fill="#34D399"/>
                <defs>
                    <linearGradient id="circuit-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#10B981" stop-opacity="0.6"/>
                        <stop offset="100%" stop-color="#34D399" stop-opacity="0.3"/>
                    </linearGradient>
                    <linearGradient id="circuit-grad2" x1="100%" y1="0%" x2="0%" y2="0%">
                        <stop offset="0%" stop-color="#34D399" stop-opacity="0.5"/>
                        <stop offset="100%" stop-color="#10B981" stop-opacity="0.2"/>
                    </linearGradient>
                </defs>
            </svg>
        </div>

        <div class="login-wrapper">
            <div class="login-card">
                <div class="login-logo">
                    <div class="login-logo-circle">
                        <img src="{% static 'images/nock-logo-icon.png' %}" alt="Nock" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover;">
                    </div>
                </div>
                <div class="login-brand">
                    <div class="login-brand-name ncc-gradient-text">Nock Dashboard</div>
                    <div class="login-brand-sub">Technologies</div>
                </div>
                {% block card_content %}{% endblock %}
            </div>
            <p class="login-footer">Nock Technologies</p>
        </div>
    </div>
</body>
</html>
