{% extends "base.html" %}
{% block title %}Session Handoffs — NockCC{% endblock %}

{% block content %}
<style>
  .handoff-card { transition: border-color 0.15s ease; }
  .handoff-card:hover { border-color: var(--border-strong); }
  .badge { display:inline-flex; align-items:center; padding:2px 8px; border-radius:6px; font-size:11px; font-weight:600; }
  .badge-open { background: rgba(239, 68, 68, 0.15); color:#F87171; }
  .badge-completed { background: rgba(16, 185, 129, 0.15); color:#34D399; }
  .badge-deferred { background: rgba(234, 179, 8, 0.15); color:#FBBF24; }
  .ctx-pill {
    display:inline-flex; align-items:center; gap:6px;
    padding:3px 10px; border-radius:9999px; font-size:11px; font-weight:600;
    background: rgba(99, 102, 241, 0.15); color:#A5B4FC; letter-spacing:0.02em;
  }
  .item-row { display:flex; align-items:flex-start; gap:var(--space-3); padding:var(--space-2) 0; border-bottom:1px solid var(--border-subtle); }
  .item-row:last-child { border-bottom:none; }
  .item-row .item-text { flex:1; min-width:0; color:var(--text-secondary); font-size:13px; line-height:1.5; }
  .item-row.completed .item-text { text-decoration:line-through; opacity:0.6; }
  .reason { font-size:11px; color:var(--text-muted); font-style:italic; margin-top:2px; }
  .handoff-header-btn {
    all: unset;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: var(--space-3);
    width: 100%;
    cursor: pointer;
    box-sizing: border-box;
  }
  .handoff-header-btn:focus-visible {
    outline: 2px solid var(--emerald-500);
    outline-offset: 2px;
    border-radius: 4px;
  }
</style>

<div class="page-container"
     x-data="handoffsBrowser()"
     x-init="init()">

  <!-- Header -->
  <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:var(--space-6);">
    <div>
      <h1 class="text-xl font-semibold" style="color:var(--text-primary);">Session Handoffs</h1>
      <p class="text-sm text-muted">Operational state per context — what shipped, what's next.</p>
    </div>
    <div class="text-xs text-muted" x-text="`${handoffs.length} active`"></div>
  </div>

  <!-- Loading -->
  <template x-if="loading">
    <div class="ncc-card" style="text-align:center; padding:var(--space-8);">
      <div class="text-sm text-muted">Loading handoffs...</div>
    </div>
  </template>

  <!-- Error -->
  <template x-if="!loading && error">
    <div class="ncc-card" style="text-align:center; padding:var(--space-6); border-color:rgba(239,68,68,0.3);">
      <div class="text-sm" style="color:#F87171;" x-text="error"></div>
      <button @click="fetchHandoffs()" class="ncc-btn ncc-btn-sm ncc-btn-ghost" style="margin-top:var(--space-3);">Retry</button>
    </div>
  </template>

  <!-- Empty state — only when there is no error -->
  <template x-if="!loading && !error && handoffs.length === 0">
    <div class="ncc-card" style="text-align:center; padding:var(--space-8);">
      <i data-lucide="git-compare-arrows" style="width:32px; height:32px; opacity:0.4;"></i>
      <div class="text-sm text-muted" style="margin-top:var(--space-3);">No handoffs yet.</div>
      <div class="text-xs text-muted" style="margin-top:var(--space-1);">The evening-wrap cron writes the first handoff.</div>
    </div>
  </template>

  <!-- Cards -->
  <div style="display:flex; flex-direction:column; gap:var(--space-3);">
    <template x-for="h in handoffs" :key="h.context">
      <div class="ncc-card handoff-card">
        <!-- Card header — semantic button for keyboard + screen-reader access -->
        <button type="button"
                class="handoff-header-btn"
                :aria-expanded="isExpanded(h.context).toString()"
                :aria-controls="`handoff-panel-${h.context}`"
                @click="toggleExpand(h.context)">
          <div style="flex:1; min-width:0;">
            <div style="display:flex; align-items:center; gap:var(--space-2); margin-bottom:var(--space-2);">
              <span class="ctx-pill" x-text="h.context"></span>
              <span class="text-xs text-muted" x-text="'v' + h.version"></span>
              <span class="text-xs text-muted" x-text="formatDate(h.updated_at)"></span>
            </div>
            <div class="text-sm font-medium" style="color:var(--text-primary); text-align:left;" x-text="h.title"></div>
            <div style="display:flex; gap:var(--space-2); margin-top:var(--space-2);">
              <span x-show="h.open_items_count > 0" class="badge badge-open" x-text="h.open_items_count + ' open'"></span>
              <span x-show="h.completed_items_count > 0" class="badge badge-completed" x-text="h.completed_items_count + ' done'"></span>
              <span x-show="h.deferred_items_count > 0" class="badge badge-deferred" x-text="h.deferred_items_count + ' deferred'"></span>
            </div>
          </div>
          <span class="text-xs text-muted" aria-hidden="true" x-text="isExpanded(h.context) ? '▲' : '▼'" style="flex-shrink:0;"></span>
        </button>

        <!-- Expanded body -->
        <template x-if="isExpanded(h.context)">
          <div :id="`handoff-panel-${h.context}`"
               style="margin-top:var(--space-4); border-top:1px solid var(--border-subtle); padding-top:var(--space-4);">
            <!-- Loading (only when no detail and no detail-error yet) -->
            <template x-if="!detail[h.context] && !detailErrors[h.context]">
              <div class="text-xs text-muted">Loading...</div>
            </template>
            <!-- Detail fetch failed -->
            <template x-if="detailErrors[h.context]">
              <div class="text-xs" style="color:#F87171;">
                <span x-text="detailErrors[h.context]"></span>
                <button type="button" @click="retryDetail(h.context)" class="ncc-card-link" style="margin-left:var(--space-2);">Retry</button>
              </div>
            </template>
            <template x-if="detail[h.context]">
              <div>
                <!-- Narrative -->
                <div class="text-sm" style="white-space:pre-wrap; line-height:1.7; color:var(--text-secondary); margin-bottom:var(--space-4);"
                     x-text="detail[h.context].content"></div>

                <!-- Action items checklist -->
                <template x-if="detail[h.context].action_items && detail[h.context].action_items.length > 0">
                  <div>
                    <div class="text-xs text-muted" style="text-transform:uppercase; letter-spacing:0.05em; margin-bottom:var(--space-2);">Action Items</div>
                    <template x-for="(item, idx) in detail[h.context].action_items" :key="idx">
                      <div class="item-row" :class="item.status === 'completed' ? 'completed' : ''">
                        <span x-show="item.status === 'completed'" class="badge badge-completed" style="flex-shrink:0;">✓</span>
                        <span x-show="item.status === 'open'" class="badge badge-open" style="flex-shrink:0;">○</span>
                        <span x-show="item.status === 'deferred'" class="badge badge-deferred" style="flex-shrink:0;">⏸</span>
                        <div class="item-text">
                          <div x-text="item.description"></div>
                          <template x-if="item.status === 'deferred' && item.reason">
                            <div class="reason" x-text="'Deferred: ' + item.reason"></div>
                          </template>
                        </div>
                      </div>
                    </template>
                  </div>
                </template>

                <!-- Footer: history link + previous-resolved indicator -->
                <div style="display:flex; align-items:center; justify-content:space-between; margin-top:var(--space-4); padding-top:var(--space-3); border-top:1px solid var(--border-subtle);">
                  <div class="text-xs text-muted">
                    <span x-show="detail[h.context].previous_items_resolved">✓ Previous items reviewed</span>
                    <span x-show="!detail[h.context].previous_items_resolved" style="color:#FBBF24;">⚠ Previous items not yet reviewed</span>
                  </div>
                  <button @click.stop="loadHistory(h.context)" class="ncc-card-link">
                    History (<span x-text="(history[h.context] || []).length"></span>)
                  </button>
                </div>

                <!-- History list -->
                <template x-if="historyShown[h.context]">
                  <div style="margin-top:var(--space-3); padding:var(--space-3); background:var(--surface-1); border-radius:6px;">
                    <div class="text-xs text-muted" style="margin-bottom:var(--space-2);">Version history (newest first)</div>
                    <!-- Error sentinel — distinct from an empty history -->
                    <template x-if="historyErrors[h.context]">
                      <div class="text-xs" style="color:#F87171;">
                        <span x-text="historyErrors[h.context]"></span>
                        <button type="button" @click.stop="retryHistory(h.context)" class="ncc-card-link" style="margin-left:var(--space-2);">Retry</button>
                      </div>
                    </template>
                    <template x-if="!historyErrors[h.context] && Array.isArray(history[h.context]) && history[h.context].length === 0">
                      <div class="text-xs text-muted">No prior versions.</div>
                    </template>
                    <template x-if="!historyErrors[h.context] && Array.isArray(history[h.context])">
                      <div>
                        <template x-for="v in history[h.context]" :key="v.version">
                          <div style="border-top:1px solid var(--border-subtle); padding-top:var(--space-2); margin-top:var(--space-2);">
                            <div class="text-xs" style="color:var(--text-secondary);">
                              v<span x-text="v.version"></span> — <span x-text="v.title"></span>
                            </div>
                            <div class="text-xs text-muted" x-text="formatDate(v.created_at) + ' · ' + (v.updated_by || 'system')"></div>
                          </div>
                        </template>
                      </div>
                    </template>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </template>
      </div>
    </template>
  </div>
</div>

<script>
function handoffsBrowser() {
  return {
    handoffs: [],
    detail: {},
    detailErrors: {},
    history: {},
    historyErrors: {},
    historyShown: {},
    expandedContexts: [],
    loading: true,
    error: null,

    async init() {
      await this.fetchHandoffs();
    },

    isExpanded(ctx) {
      return this.expandedContexts.includes(ctx);
    },

    async fetchHandoffs() {
      this.loading = true;
      this.error = null;
      try {
        const resp = await fetch('/api/brain/handoffs/');
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const json = await resp.json();
        if (json.success) {
          this.handoffs = json.data.handoffs;
        } else {
          this.error = json.message || 'Failed to load handoffs';
          console.error('Handoffs fetch failed:', json.message);
        }
      } catch(e) {
        this.error = 'Failed to load handoffs';
        console.error('Handoffs fetch failed:', e);
      } finally {
        this.loading = false;
      }
    },

    async toggleExpand(ctx) {
      if (this.isExpanded(ctx)) {
        this.expandedContexts = this.expandedContexts.filter(x => x !== ctx);
        return;
      }
      this.expandedContexts = [...this.expandedContexts, ctx];
      if (!this.detail[ctx]) {
        await this.fetchDetail(ctx);
      }
    },

    async fetchDetail(ctx) {
      // Clear prior error so Loading... is shown during the (re)fetch
      this.detailErrors = { ...this.detailErrors, [ctx]: null };
      try {
        const resp = await fetch(`/api/brain/handoffs/${ctx}/`);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const json = await resp.json();
        if (json.success) {
          this.detail = { ...this.detail, [ctx]: json.data };
        } else {
          this.detailErrors = { ...this.detailErrors, [ctx]: json.message || 'Failed to load handoff' };
          console.error('Handoff detail fetch failed:', json.message);
        }
      } catch(e) {
        this.detailErrors = { ...this.detailErrors, [ctx]: 'Failed to load handoff' };
        console.error('Handoff detail fetch failed:', e);
      }
    },

    async retryDetail(ctx) {
      await this.fetchDetail(ctx);
    },

    async loadHistory(ctx) {
      // Toggle visibility
      if (this.historyShown[ctx]) {
        this.historyShown = { ...this.historyShown, [ctx]: false };
        return;
      }
      this.historyShown = { ...this.historyShown, [ctx]: true };
      if (!Array.isArray(this.history[ctx]) && !this.historyErrors[ctx]) {
        await this.fetchHistory(ctx);
      }
    },

    async fetchHistory(ctx) {
      // Clear any prior error
      this.historyErrors = { ...this.historyErrors, [ctx]: null };
      try {
        const resp = await fetch(`/api/brain/handoffs/${ctx}/history/`);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const json = await resp.json();
        if (json.success) {
          this.history = { ...this.history, [ctx]: json.data.versions };
        } else {
          this.historyErrors = { ...this.historyErrors, [ctx]: json.message || 'Failed to load history' };
          console.error('History fetch failed:', json.message);
        }
      } catch(e) {
        this.historyErrors = { ...this.historyErrors, [ctx]: 'Failed to load history' };
        console.error('History fetch failed:', e);
      }
    },

    async retryHistory(ctx) {
      await this.fetchHistory(ctx);
    },

    formatDate(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return '';
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) +
             ' ' + d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
    },
  };
}
</script>
{% endblock %}
