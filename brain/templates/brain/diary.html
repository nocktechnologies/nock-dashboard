{% extends "base.html" %}
{% block title %}Mara's Diary — NockCC{% endblock %}

{% block content %}
<div class="page-container"
     x-data="diaryBrowser()"
     x-init="init()">

  <!-- Header -->
  <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:var(--space-6);">
    <div>
      <h1 class="text-xl font-semibold" style="color:var(--text-primary);">Mara's Diary</h1>
      <p class="text-sm text-muted" x-text="`${totalEntries} entries`"></p>
    </div>
    <button @click="showNewEntry = true"
            class="ncc-btn ncc-btn-sm"
            style="background:var(--emerald-500); color:#000; font-weight:600;">
      + New Entry
    </button>
  </div>

  <div style="display:grid; grid-template-columns:240px 1fr; gap:var(--space-6);">

    <!-- Sidebar -->
    <aside>
      <div class="ncc-card" style="position:sticky; top:var(--space-4);">
        <div class="ncc-card-header" style="margin-bottom:var(--space-4);">
          <span class="ncc-card-label">Filter</span>
          <button @click="resetFilters()" class="ncc-card-link">Reset</button>
        </div>
        <div style="margin-bottom:var(--space-3);">
          <label class="text-xs text-muted" style="display:block; margin-bottom:var(--space-1);">Search</label>
          <input type="text" x-model="filters.search" @input.debounce.400ms="fetchEntries()"
                 placeholder="Search..." class="ncc-input" style="width:100%;">
        </div>
        <div style="margin-bottom:var(--space-3);">
          <label class="text-xs text-muted" style="display:block; margin-bottom:var(--space-1);">Category</label>
          <select x-model="filters.category" @change="fetchEntries()" class="ncc-select" style="width:100%;">
            <option value="">All</option>
            {% for cat in categories %}
            <option value="{{ cat.code }}">{{ cat.label }}</option>
            {% endfor %}
          </select>
        </div>
        <div style="margin-bottom:var(--space-3);">
          <label class="text-xs text-muted" style="display:block; margin-bottom:var(--space-1);">From</label>
          <input type="date" x-model="filters.date_from" @change="fetchEntries()" class="ncc-input" style="width:100%;">
        </div>
        <div style="margin-bottom:var(--space-3);">
          <label class="text-xs text-muted" style="display:block; margin-bottom:var(--space-1);">To</label>
          <input type="date" x-model="filters.date_to" @change="fetchEntries()" class="ncc-input" style="width:100%;">
        </div>
        <div style="margin-bottom:var(--space-3);">
          <label class="text-xs text-muted" style="display:block; margin-bottom:var(--space-1);">Source</label>
          <select x-model="filters.source" @change="fetchEntries()" class="ncc-select" style="width:100%;">
            <option value="">All</option>
            {% for src in sources %}
            <option value="{{ src.code }}">{{ src.label }}</option>
            {% endfor %}
          </select>
        </div>
        <div style="border-top:1px solid var(--border-subtle); padding-top:var(--space-3); margin-top:var(--space-2);">
          <div class="text-xs text-muted" x-text="`Showing ${entries.length} of ${total}`"></div>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <main>
      <template x-if="loading">
        <div class="text-sm text-muted" style="padding:var(--space-4);">Loading...</div>
      </template>
      <template x-if="!loading && entries.length === 0">
        <div class="ncc-card" style="text-align:center; padding:var(--space-8);">
          <div class="text-muted text-sm">No diary entries found</div>
        </div>
      </template>
      <template x-for="entry in entries" :key="entry.id">
        <div class="ncc-card" style="margin-bottom:var(--space-3); cursor:pointer;"
             @click="toggleExpand(entry.id)">
          <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:var(--space-3);">
            <div style="flex:1; min-width:0;">
              <div style="display:flex; align-items:center; gap:var(--space-2); margin-bottom:var(--space-1);">
                <span class="brain-pill" x-text="entry.category.replace('_','-')"></span>
                <span class="text-xs text-muted" x-text="formatDate(entry.entry_date)"></span>
                <span class="text-xs text-muted" x-text="entry.word_count + 'w'"></span>
              </div>
              <div class="text-sm font-medium" x-text="entry.title" style="color:var(--text-primary); margin-bottom:var(--space-1);"></div>
              <div class="text-xs text-secondary" x-text="entry.excerpt" x-show="!isExpanded(entry.id)"></div>
            </div>
            <span class="text-xs text-muted" x-text="isExpanded(entry.id) ? '▲' : '▼'" style="flex-shrink:0;"></span>
          </div>
          <template x-if="entry.tags && entry.tags.length > 0">
            <div style="display:flex; flex-wrap:wrap; gap:var(--space-1); margin-top:var(--space-2);">
              <template x-for="tag in entry.tags" :key="tag">
                <span class="brain-pill" x-text="tag" style="font-size:10px; opacity:0.7;"></span>
              </template>
            </div>
          </template>
          <template x-if="isExpanded(entry.id)">
            <div style="margin-top:var(--space-4); border-top:1px solid var(--border-subtle); padding-top:var(--space-4);">
              <div class="text-sm" style="white-space:pre-wrap; line-height:1.7; color:var(--text-secondary);"
                   x-text="fullContent[entry.id] || 'Loading...'"></div>
            </div>
          </template>
        </div>
      </template>
      <template x-if="!loading && total > entries.length">
        <div style="display:flex; justify-content:center; margin-top:var(--space-4);">
          <button @click="loadMore()" class="ncc-btn ncc-btn-sm ncc-btn-ghost">
            Load more (<span x-text="entries.length"></span> of <span x-text="total"></span>)
          </button>
        </div>
      </template>
    </main>
  </div>

  <!-- New Entry Modal -->
  <template x-if="showNewEntry">
    <div style="position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:100; display:flex; align-items:center; justify-content:center;"
         @click.self="showNewEntry = false">
      <div class="ncc-card" style="width:600px; max-height:80vh; overflow-y:auto;" @click.stop>
        <div class="ncc-card-header" style="margin-bottom:var(--space-4);">
          <span class="ncc-card-label">New Diary Entry</span>
          <button @click="showNewEntry = false" class="ncc-card-link">Close</button>
        </div>
        <form @submit.prevent="createEntry()">
          <div style="margin-bottom:var(--space-3);">
            <label class="text-xs text-muted" style="display:block; margin-bottom:var(--space-1);">Title</label>
            <input type="text" x-model="newEntry.title" class="ncc-input" style="width:100%;" required>
          </div>
          <div style="margin-bottom:var(--space-3);">
            <label class="text-xs text-muted" style="display:block; margin-bottom:var(--space-1);">Category</label>
            <select x-model="newEntry.category" class="ncc-select" style="width:100%;" required>
              {% for cat in categories %}
              <option value="{{ cat.code }}">{{ cat.label }}</option>
              {% endfor %}
            </select>
          </div>
          <div style="margin-bottom:var(--space-3);">
            <label class="text-xs text-muted" style="display:block; margin-bottom:var(--space-1);">Content</label>
            <textarea x-model="newEntry.content" class="ncc-input"
                      style="width:100%; height:200px; resize:vertical; font-family:var(--font-mono); font-size:13px;"
                      required></textarea>
          </div>
          <div style="display:flex; gap:var(--space-2); justify-content:flex-end;">
            <button type="button" @click="showNewEntry = false" class="ncc-btn ncc-btn-sm ncc-btn-ghost">Cancel</button>
            <button type="submit" :disabled="saving" class="ncc-btn ncc-btn-sm"
                    style="background:var(--emerald-500); color:#000; font-weight:600;">
              <span x-text="saving ? 'Saving...' : 'Save Entry'"></span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </template>
</div>

<script>
function diaryBrowser() {
  return {
    entries: [],
    total: 0,
    totalEntries: {{ total_entries }},
    loading: false,
    offset: 0,
    limit: 20,
    expandedIds: [],
    fullContent: {},
    showNewEntry: false,
    saving: false,
    newEntry: { title: '', content: '', category: 'work' },
    filters: { search: '', category: '', date_from: '', date_to: '', source: '' },

    init() { this.fetchEntries(); },

    isExpanded(id) { return this.expandedIds.includes(id); },

    resetFilters() {
      this.filters = { search: '', category: '', date_from: '', date_to: '', source: '' };
      this.fetchEntries();
    },

    async fetchEntries() {
      this.loading = true;
      this.offset = 0;
      const params = new URLSearchParams({ limit: this.limit, offset: 0 });
      if (this.filters.search) params.set('search', this.filters.search);
      if (this.filters.category) params.set('category', this.filters.category);
      if (this.filters.date_from) params.set('date_from', this.filters.date_from);
      if (this.filters.date_to) params.set('date_to', this.filters.date_to);
      if (this.filters.source) params.set('source', this.filters.source);
      try {
        const resp = await fetch(`/api/brain/diary/?${params}`);
        const json = await resp.json();
        if (json.success) { this.entries = json.data.entries; this.total = json.data.total; }
      } catch(e) { console.error('Diary fetch failed:', e); }
      this.loading = false;
    },

    async loadMore() {
      const nextOffset = this.offset + this.limit;
      const params = new URLSearchParams({ limit: this.limit, offset: nextOffset });
      if (this.filters.search) params.set('search', this.filters.search);
      if (this.filters.category) params.set('category', this.filters.category);
      if (this.filters.date_from) params.set('date_from', this.filters.date_from);
      if (this.filters.date_to) params.set('date_to', this.filters.date_to);
      if (this.filters.source) params.set('source', this.filters.source);
      try {
        const resp = await fetch(`/api/brain/diary/?${params}`);
        const json = await resp.json();
        if (json.success) {
          this.entries = [...this.entries, ...json.data.entries];
          this.offset = nextOffset;
        }
      } catch(e) { console.error('Load more failed:', e); }
    },

    async toggleExpand(id) {
      if (this.isExpanded(id)) {
        this.expandedIds = this.expandedIds.filter(x => x !== id);
        return;
      }
      this.expandedIds = [...this.expandedIds, id];
      if (!this.fullContent[id]) {
        try {
          const resp = await fetch(`/api/brain/diary/${id}/`);
          const json = await resp.json();
          if (json.success) this.fullContent[id] = json.data.content;
        } catch(e) { this.fullContent[id] = 'Failed to load content.'; }
      }
    },

    async createEntry() {
      this.saving = true;
      try {
        const resp = await fetch('/api/brain/diary/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-CSRFToken': this.getCsrf() },
          body: JSON.stringify({ title: this.newEntry.title, content: this.newEntry.content, category: this.newEntry.category }),
        });
        const json = await resp.json();
        if (json.success) {
          this.showNewEntry = false;
          this.newEntry = { title: '', content: '', category: 'work' };
          this.totalEntries++;
          await this.fetchEntries();
        }
      } catch(e) { console.error('Create failed:', e); }
      this.saving = false;
    },

    getCsrf() {
      const m = document.cookie.match(/csrftoken=([^;]+)/);
      return m ? m[1] : '';
    },

    formatDate(iso) {
      return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    },
  };
}
</script>
{% endblock %}
