name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: nock_test
          POSTGRES_USER: nock
          POSTGRES_PASSWORD: nock
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://nock:nock@localhost:5432/nock_test
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SECRET_KEY: ci-secret-key-not-for-production
      FERNET_KEYS: BefQW1z8may_vOOWE1n2lqgLXbnT1eNh2h5rNg1eDjo=
      TEST_FERNET_KEY: BefQW1z8may_vOOWE1n2lqgLXbnT1eNh2h5rNg1eDjo=
      TEST_WEBHOOK_SECRET: ci-webhook-secret-not-for-production

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python manage.py test --parallel
