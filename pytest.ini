[pytest]
DJANGO_SETTINGS_MODULE = config.settings.dev
python_files = tests/test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
testpaths =
    dashboard/tests
    pipeline/tests
    sessions/tests
    context/tests
    spend/tests
    notifications/tests
    accounts/tests
    core/tests
    tasks/tests
    cli/tests
    remote/tests
    agent/tests
    vault/tests
    crm/tests
    intelligence/tests
    teams/tests
    workspaces/tests
    tests
