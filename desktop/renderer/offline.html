<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>NockCC — Offline</title>
    <style>
        body {
            margin: 0;
            background: #000000;
            color: #E8E8ED;
            font-family: -apple-system, BlinkMacSystemFont, 'DM Sans', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            -webkit-app-region: drag;
        }
        .container { text-align: center; }
        .icon { font-size: 48px; margin-bottom: 16px; }
        .title { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
        .message { font-size: 13px; color: #6B6B80; margin-bottom: 24px; }
        .retry {
            -webkit-app-region: no-drag;
            padding: 10px 24px;
            background: linear-gradient(135deg, #10B981, #34D399);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
        }
        .retry:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">&#x1F4E1;</div>
        <div class="title">Can't reach NockCC</div>
        <div class="message">Check your internet connection or try again in a moment.</div>
        <button class="retry" onclick="window.nockcc.retry()">Retry</button>
    </div>
</body>
</html>
