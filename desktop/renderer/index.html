<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>NockCC</title>
    <style>
        body {
            margin: 0;
            background: #000000;
            color: #E8E8ED;
            font-family: -apple-system, BlinkMacSystemFont, 'DM Sans', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            -webkit-app-region: drag;
        }
        .loader {
            text-align: center;
        }
        .logo {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #10B981, #34D399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 16px;
        }
        .subtitle {
            font-size: 12px;
            color: #6B6B80;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        .dots {
            margin-top: 24px;
            display: flex;
            justify-content: center;
            gap: 8px;
        }
        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #10B981;
            animation: pulse 1.2s ease-in-out infinite;
        }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }
    </style>
</head>
<body>
    <div class="loader">
        <div class="logo">NockCC</div>
        <div class="subtitle">Command Center</div>
        <div class="dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>
</body>
</html>
